name: macOS tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
      - name: Static checks and actual Homebrew cask audit
        run: |
          bash -n scripts/test.sh scripts/release.sh scripts/release-preflight.sh scripts/test-release-preflight.sh
          test -x scripts/release.sh  # Catch executable-bit regressions
          ruby -c Casks/lock-my-keyboard.rb
          # brew audit no longer accepts a file path. Clone *this checkout* as a local
          # tap so the audit uses the PR cask, not the published default branch.
          brew tap mahboobmonnamd/lock-my-keyboard "$PWD"
          brew trust --cask mahboobmonnamd/lock-my-keyboard/lock-my-keyboard
          brew audit --cask --skip-style mahboobmonnamd/lock-my-keyboard/lock-my-keyboard
      - name: Release preflight negative tests (offline)
        run: bash scripts/test-release-preflight.sh
      - name: Quarantine handling smoke
        run: |
          set -euo pipefail
          app="$(mktemp -d)/Fixture.app"
          mkdir -p "$app/Contents"
          touch "$app/Contents/fixture"
          /usr/bin/xattr -w com.apple.quarantine "0081;00000000;test;00000000" "$app/Contents/fixture"
          /usr/bin/xattr -dr com.apple.quarantine "$app"
          if /usr/bin/xattr -p com.apple.quarantine "$app/Contents/fixture" >/dev/null 2>&1; then
            echo "Quarantine remains after removal" >&2
            exit 1
          fi
          /usr/bin/xattr -dr com.apple.quarantine "$app" # Already clean must not fail
      - name: Swift tests
        run: ./scripts/test.sh
